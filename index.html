<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FRSIS</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* 0xmhsr */
:root{
  --bg:#CADC9F; --surface:#E6F0C8; --surface2:#B5CC84; --ink:#1B2E12; --muted:#44582F; --line:#1B2E12;
  --accent:#306230; --on-accent:#E6F0C8; --accent-soft:#B5CC84;
  --warn:#5C3400; --warn-bg:#F3D98B; --bad:#8F1D14; --ok:#1B5E20; --ok-bg:#BFE3A3;
  --font-display:'Press Start 2P','Courier New',monospace;
  --font-body:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --font-mono:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --shadow:4px 4px 0 var(--line);
  --shadow-sm:3px 3px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1022; --surface:#171A33; --surface2:#232850; --ink:#E8F0FF; --muted:#A3AEDD; --line:#7E8BE0;
    --accent:#4DF0D2; --on-accent:#06201C; --accent-soft:#232850;
    --warn:#FFD66B; --warn-bg:#40300A; --bad:#FF9A92; --ok:#7BE89B; --ok-bg:#16361F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1022; --surface:#171A33; --surface2:#232850; --ink:#E8F0FF; --muted:#A3AEDD; --line:#7E8BE0;
  --accent:#4DF0D2; --on-accent:#06201C; --accent-soft:#232850;
  --warn:#FFD66B; --warn-bg:#40300A; --bad:#FF9A92; --ok:#7BE89B; --ok-bg:#16361F;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;
  padding-block:0 124px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3,p,ol,ul{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 0 12px;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:0 0 auto;width:46px;height:46px;background:var(--accent);color:var(--on-accent);border:3px solid var(--line);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.brand{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.04em;line-height:1.1}
.brand::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tagline{color:var(--muted);font-size:14px;margin-top:5px;overflow-wrap:anywhere}
.srow{display:flex;gap:8px}
.searchbox{position:relative;flex:1 1 auto;min-width:0}
.prompt{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:14px;color:var(--accent);pointer-events:none}
.search{width:100%;min-height:50px;border:3px solid var(--line);background:var(--surface);padding:0 12px 0 36px;font-size:16px;box-shadow:var(--shadow-sm)}
.sort{flex:0 0 auto;min-height:50px;border:3px solid var(--line);background:var(--surface);padding:0 8px;font-size:15px;max-width:40%;box-shadow:var(--shadow-sm)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 12px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tab .n{font-variant-numeric:tabular-nums;margin-left:6px;opacity:.8}

.banner{background:var(--warn-bg);color:var(--warn);border:3px solid var(--line);padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 14px}
.banner button{flex:0 0 auto;min-height:38px;padding:0 12px;border:3px solid currentColor;background:transparent;color:inherit;font-weight:600;cursor:pointer;font-size:14px}

.list{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.card{display:flex;gap:14px;background:var(--surface);border:3px solid var(--line);padding:12px;text-align:left;width:100%;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.card:hover{background:var(--surface2)}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.thumb{flex:0 0 96px;width:96px;height:96px;border:3px solid var(--line);background:var(--accent-soft);overflow:hidden;display:grid;place-items:center;color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);overflow-wrap:anywhere}
.cbody h3{font-family:var(--font-body);font-weight:700;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.addr{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.ciri{font-size:15px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:2px solid var(--line);padding:1px 8px;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.chip.lm::before{content:"";width:6px;height:6px;background:var(--accent);flex:0 0 auto}
.chip.area{background:var(--accent);color:var(--on-accent)}
.chip.ex{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.ph{font-size:13px}
.chip.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.chip.no{color:var(--muted)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:transparent}

.btn{min-height:48px;padding:0 16px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);gap:6px;position:relative;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.bad{color:var(--bad);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn:focus-within{outline:3px dashed var(--accent);outline-offset:3px}
.file-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.empty{background:var(--surface);border:3px dashed var(--line);padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:13px;line-height:1.5;color:var(--ink)}
.empty p{max-width:34ch}
.empty-ic{width:76px;height:76px;border:3px solid var(--line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:8px;background:var(--surface);border:3px solid var(--line);padding:8px;box-shadow:var(--shadow);pointer-events:auto}
.bar-in .btn{flex:1 1 0;padding:0 6px;min-width:0;white-space:nowrap;box-shadow:none;background:var(--surface2)}
.bar-in .btn.primary{flex:1.5 1 0;background:var(--accent)}
.bar-in .btn:active{transform:translate(2px,2px)}

.overlay{position:fixed;inset:0;z-index:50;background-color:rgba(0,0,0,.4);background-image:linear-gradient(45deg,rgba(0,0,0,.28) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.28) 75%),linear-gradient(45deg,rgba(0,0,0,.28) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.28) 75%);background-size:4px 4px;background-position:0 0,2px 2px;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border:3px solid var(--line);border-bottom:0;padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 0 var(--line);display:flex;flex-direction:column;gap:14px;animation:rise .24s steps(5)}
.sheet::before{content:"";flex:0 0 6px;width:72px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);align-self:center}
@keyframes rise{from{transform:translateY(40px)}to{transform:none}}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:15px;margin-top:-6px;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:15px;font-weight:600}
.hint{font-size:14px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{min-height:48px;border:3px solid var(--line);background:var(--surface);padding:9px 12px;font-size:16px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.grid-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-actions .full{grid-column:1/-1}
.form{display:flex;flex-direction:column;gap:14px}

.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.shot{flex:0 0 86%;height:260px;object-fit:cover;border:3px solid var(--line);scroll-snap-align:start;cursor:zoom-in;background:var(--surface2)}
.gallery.one .shot{flex-basis:100%}
.nophoto{height:120px;border:3px dashed var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:15px;text-align:center;padding:0 12px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.steps{padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:0 0 30px;height:30px;border:3px solid var(--line);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:700}
.alert{background:var(--warn-bg);color:var(--warn);border:3px solid var(--line);padding:10px 12px;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-item{position:relative;aspect-ratio:1;max-width:100%;border:3px solid var(--line);overflow:hidden;background:var(--surface2)}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block}
.ph-item button{position:absolute;top:0;right:0;width:28px;height:28px;border:0;background:var(--ink);color:var(--surface);font-size:18px;line-height:1;cursor:pointer}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border:3px solid #fff}
.ai-stats{font-size:15px;background:var(--surface2);border:3px solid var(--line);padding:10px 12px;overflow-wrap:anywhere}
.ai-quick{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.ai-quick .tab{white-space:normal;text-align:left;min-height:40px;padding:6px 10px;font-size:14px}
.ai-log{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;padding:0 4px 4px 0}
.bubble{padding:10px 12px;border:3px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--line)}
.bubble.ai{align-self:flex-start;background:var(--surface2);box-shadow:3px 3px 0 var(--line)}
.imp-list{display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow:auto;padding:2px 4px 4px 2px}
.imp-row{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border:3px solid var(--line);padding:10px}
.imp-row.off{opacity:.65}
.imp-main{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.imp-main input{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto;margin-top:2px}
.imp-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.imp-body b{overflow-wrap:anywhere;font-weight:700}
.imp-photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:34px}
.imp-thumb{position:relative;width:54px;height:54px;border:3px solid var(--line);overflow:hidden;background:var(--surface)}
.imp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imp-thumb button{position:absolute;top:0;right:0;width:22px;height:22px;border:0;background:var(--ink);color:var(--surface);font-size:15px;line-height:1;cursor:pointer}
.bk{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border:3px solid var(--line);padding:12px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:3px solid var(--line);padding:10px 16px;font-size:15px;font-weight:600;z-index:80;max-width:90%;text-align:center;box-shadow:var(--shadow)}
@media (max-width:360px){.row2,.sheet-actions,.grid-actions{grid-template-columns:1fr}}
@media (max-width:400px){.thumb{flex-basis:78px;width:78px;height:78px}.sort{max-width:36%}.brand{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="hrow">
      <div class="brandrow">
        <span class="logo" aria-hidden="true"><svg width="18" height="20" viewBox="0 0 9 10" fill="currentColor" shape-rendering="crispEdges"><rect x="2" y="0" width="5" height="1"/><rect x="1" y="1" width="7" height="1"/><rect x="0" y="2" width="9" height="1"/><rect x="0" y="3" width="3" height="1"/><rect x="6" y="3" width="3" height="1"/><rect x="0" y="4" width="3" height="1"/><rect x="6" y="4" width="3" height="1"/><rect x="0" y="5" width="9" height="1"/><rect x="1" y="6" width="7" height="1"/><rect x="2" y="7" width="5" height="1"/><rect x="3" y="8" width="3" height="1"/><rect x="4" y="9" width="1" height="1"/></svg></span>
        <div>
          <h1 class="brand">FRSIS</h1>
          <p class="tagline" id="tagline">Catatan alamat, foto rumah, dan petunjuk arah untuk kurir</p>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="viewer" id="viewer" hidden><img id="vimg" alt="Foto rumah diperbesar"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var uid = function(){ return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
  var lines = function(s){ return String(s||'').split('\n').map(function(x){return x.trim();}).filter(Boolean); };
  var state = { places:[], area:'Semua', q:'', loaded:false, draft:null, memoryOnly:false };

  /* ---------- Penyimpanan (IndexedDB) ---------- */
  var db=null;
  function reqP(r){ return new Promise(function(res,rej){ r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
  function openDB(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open('patokan',1);
        r.onupgradeneeded=function(){ var d=r.result; d.createObjectStore('places',{keyPath:'id'}); d.createObjectStore('meta'); };
        r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; r.onblocked=function(){rej(new Error('blocked'));};
      }catch(e){ rej(e); }
    });
  }
  function store(name,mode){ return db.transaction(name,mode).objectStore(name); }
  function putPlace(p){
    if(!db) return Promise.resolve();
    return reqP(store('places','readwrite').put(p)).catch(function(){ toast('Gagal menyimpan. Ruang penyimpanan mungkin penuh.'); });
  }
  function delPlace(id){
    if(!db) return Promise.resolve();
    return reqP(store('places','readwrite').delete(id)).catch(function(){});
  }

  function boot(){
    openDB().then(function(d){
      db=d;
      return reqP(store('places','readonly').getAll());
    }).then(function(rows){
      var ex=rows.filter(function(x){return x.sample;});
      state.places=rows.filter(function(x){return !x.sample;});
      return Promise.all(ex.map(function(x){ return delPlace(x.id); }));
    }).catch(function(){
      db=null; state.memoryOnly=true; state.places=[];
    }).then(function(){
      state.loaded=true; render();
      if(state.memoryOnly) toast('Penyimpanan tidak tersedia. Data hilang saat halaman ditutup.');
    });
  }

  var toastTimer;
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true;},2600); }
  function copy(text,okMsg){
    var fail=function(){ toast('Salin manual: '+text); };
    try{ navigator.clipboard.writeText(text).then(function(){toast(okMsg);},fail); }catch(e){ fail(); }
  }
  function byId(id){ for(var i=0;i<state.places.length;i++){ if(state.places[i].id===id) return state.places[i]; } return null; }
  function waNumber(p){ var d=String(p||'').replace(/\D/g,''); if(d.indexOf('0')===0) d='62'+d.slice(1); return d; }
  function mapsUrl(p){
    var m=(p.maps||'').trim();
    if(/^https?:\/\//i.test(m)) return m;
    return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(m||(p.alamat+' '+(p.area||'')));
  }
  function fmtDate(t){ return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); }
  function shrink(file,max,q){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var s=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',q));
        };
        img.onerror=function(){rej(new Error('img'));}; img.src=fr.result;
      };
      fr.onerror=function(){rej(fr.error);}; fr.readAsDataURL(file);
    });
  }

  function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
  function normPhone(s){
    var d=String(s||'').replace(/[^\d+]/g,''); if(!d) return '';
    if(d.indexOf('+62')===0) d='0'+d.slice(3); else if(d.indexOf('62')===0 && d.length>=11) d='0'+d.slice(2);

  function fieldFor(label){
    var n=String(label==null?'':label).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    if(!n) return null;
    if(/pengirim|sender|shipper|pickup|jemput/.test(n)) return null;
    if(/\b(resi|awb|waybill|tracking|billcode)\b|bill code/.test(n)) return 'resi';
    if(/\b(telp|telepon|hp|phone|mobile|kontak|whatsapp|wa)\b/.test(n)) return 'telp';
    if(/\bcod\b|tagihan|collect/.test(n)) return 'cod';
    if(/alamat|address/.test(n)) return 'alamat';
    if(/kecamatan|kelurahan|\bkota\b|\bcity\b|district|\barea\b|wilayah/.test(n)) return 'area';
    if(/\b(nama|penerima|receiver|recipient|consignee)\b/.test(n)) return 'nama';
    if(/catatan|\bnote\b|remark|keterangan|isi paket|barang|\bitem\b|deskripsi|description/.test(n)) return 'catatan';
    return null;
  }
  function parseDelimited(text,delim){
    var rows=[],row=[],cur='',inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
      else if(c==='"') inQ=true;
      else if(c===delim){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
    row.push(cur); rows.push(row);
    return rows.filter(function(r){ return r.some(function(x){return String(x).trim();}); });
  }
  function mkRow(o){
    var r={nama:String(o.nama||'').trim(),alamat:String(o.alamat||'').trim(),telp:normPhone(o.telp),area:String(o.area||'').trim(),catatan:String(o.catatan||'').trim(),foto:[]};
    if(!r.nama && !r.alamat) return null;

  function detectMap(headers){

  function fromTable(arr){
    arr=arr.filter(function(r){ return r.some(function(x){ return String(x==null?'':x).trim(); }); });
    if(!arr.length) return null;
    var width=0; arr.forEach(function(r){ width=Math.max(width,r.length); });
    var headers=arr[0].map(function(h){ return String(h==null?'':h).trim(); });
    while(headers.length<width) headers.push('');
    var map=detectMap(headers), body=arr.slice(1);
    if(!Object.keys(map).length){ headers=headers.map(function(_,i){ return 'Kolom '+(i+1); }); body=arr; }

  }

      var row=mkRow({nama:g('nama'),alamat:g('alamat'),telp:g('telp'),area:g('area'),catatan:g('catatan')});
      if(row) out.push(row);

  function labelBlocks(text){
    var out=[],cur={},last=null,count=0;
    function push(){ if(Object.keys(cur).length){ var r=mkRow(cur); if(r) out.push(r); } cur={}; last=null; }
    text.split('\n').forEach(function(line){
      line=line.trim();
      if(!line){ push(); return; }
      var m=line.match(/^([^:=]{2,32})[:=]\s*(.*)$/), f=m?fieldFor(m[1]):null;
      if(f){ count++; if(cur[f]) push(); cur[f]=m[2].trim(); last=f; }
      else if(last==='alamat'||last==='catatan'){ cur[last]+=', '+line; }

    push();
    return count>=2?out:null;
  }
  function freeBlocks(text){
    var out=[];
    text.split(/\n\s*\n/).forEach(function(b){
      var ls=b.split('\n').map(function(x){return x.trim();}).filter(Boolean); if(!ls.length) return;
      var joined=ls.join(' ');
      var resi=(joined.match(/\b[A-Z]{2}\d{8,14}\b/)||[''])[0];
      var tm=joined.match(/(?:\+62|62|0)8[\d\s-]{8,13}\d/), telp=tm?tm[0]:'';
      var rest=ls.map(function(l){
        if(resi) l=l.replace(resi,''); if(telp) l=l.replace(telp,''); l=l.replace(/COD[^\d]{0,12}[\d.,]+/i,'');
        return l.replace(/^[\s,;:-]+|[\s,;:-]+$/g,'');

      var r=mkRow({nama:nama,alamat:alamat,telp:telp}); if(r) out.push(r);

  }
  function jntTemplate(text){
    var parts=text.split(/(?=Halo\s+[^,\n]{1,60},\s*kami\s+dari\s+J&T)/i).filter(function(s){ return /kami\s+dari\s+J&T/i.test(s); });
    if(!parts.length) return null;
    var out=[];
    parts.forEach(function(s){
      s=s.replace(/\s+/g,' ').trim();
      var n=s.match(/Halo\s+([^,]{1,60}),\s*kami\s+dari/i);
      var a=s.match(/alamat\s+anda\s+di\s+(.+?)\s*,?\s*mohon\s+kesediaan/i);
      var k=a?a[1].match(/\bkec(?:amatan)?\.?\s*([^,]+)/i):null;
      var area=k?k[1].trim().toLowerCase().replace(/\b[a-z]/g,function(x){return x.toUpperCase();}):'';
      var r=mkRow({nama:n?n[1]:'',alamat:a?a[1].replace(/\s*,\s*/g,', '):'',area:area});
      if(r) out.push(r);

    return out.length?out:null;
  }
  function parseText(text){
    text=String(text||'').replace(/^﻿/,'').trim();
    if(!text) return null;
    var jt=jntTemplate(text); if(jt) return {mode:'teks',rows:jt};
    var first=text.split('\n')[0], delim=null;
    if(first.indexOf('\t')>-1) delim='\t';
    else { var c=(first.match(/,/g)||[]).length, s=(first.match(/;/g)||[]).length; if(c||s) delim=s>c?';':','; }
    if(delim){

    }
    var blocks=labelBlocks(text);
    return {mode:'teks',rows:blocks||freeBlocks(text)};
  }

  function findMatch(r){

  function importFile(el){

      fr.onload=function(){
        loadXLSX().then(function(X){
          var wb=X.read(fr.result,{type:'array'});
          setImp(fromTable(X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})));
        }).catch(function(){ toast('File Excel tidak bisa dibaca. Simpan sebagai CSV lalu coba lagi.'); });
      };

    } else {

        var text=String(fr.result||'').replace(/^﻿/,''), line=text.split('\n')[0]||'';
        var d=line.indexOf('\t')>-1?'\t':((line.match(/;/g)||[]).length>(line.match(/,/g)||[]).length?';':',');
        var t=fromTable(parseDelimited(text,d));

    list.forEach(function(x){
      if(!x||typeof x!=='object'||typeof x.alamat!=='string'||!x.alamat.trim()){ skip++; return; }
      var foto=(Array.isArray(x.foto)?x.foto:[]).filter(function(f){ return typeof f==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(f)&&f.length<3000000; }).slice(0,4);
      var c={id:(typeof x.id==='string'&&x.id&&x.id.length<=40)?x.id:uid(),nama:str(x.nama,200)||'Penerima',alamat:str(x.alamat,600),area:str(x.area,120),ciri:str(x.ciri,300),
        patokan:str(x.patokan,1000),arah:str(x.arah,2000),telp:str(x.telp,40),maps:str(x.maps,600),catatan:str(x.catatan,500),foto:foto,
        kunjungan:Math.max(0,parseInt(x.kunjungan,10)||0),updated:+x.updated||Date.now()};
      if(+x.lastVisit) c.lastVisit=+x.lastVisit;
      var cur=byId(c.id);
      if(cur){ if(c.updated>(cur.updated||0)){ Object.assign(cur,c); saves.push(cur); upd++; } else skip++; }
      else { state.places.push(c); saves.push(c); add++; }
    });
    Promise.all(saves.map(putPlace));
    closeSheet(); render();
    toast('Dipulihkan: '+add+' baru, '+upd+' diperbarui, '+skip+' dilewati');
  }
  var dupArmed=null;

  var STOP={alamat:1,rumah:1,paket:1,milik:1,punya:1,si:1,yang:1,di:1,ke:1,untuk:1,atas:1,nama:1,tolong:1,dong:1,ya:1,saya:1,tempat:1};
  var HELP_TEXT='Perintah yang saya pahami (jalan di perangkat, tanpa internet):\n'+
    '- cari <kata>\n- berapa alamat di <area>\n- tampilkan area <nama>, atau: semua area\n'+
    '- alamat mana yang belum lengkap\n- kelompokkan per area\n- catat <nama> sudah diantar\n'+
    '- salin petunjuk <nama>\n- tambah alamat <nama>, <alamat>\n- cadangkan';
  function tok(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean); }
  function findPlaces(q){
    var t=tok(q).filter(function(w){ return !STOP[w]; });
    if(!t.length) return [];
    var out=state.places.filter(function(p){ var h=haystack(p); return t.every(function(w){ return h.indexOf(w)>-1; }); });
    out.sort(function(a,b){
      var an=t.every(function(w){ return String(a.nama).toLowerCase().indexOf(w)>-1; })?0:1;
      var bn=t.every(function(w){ return String(b.nama).toLowerCase().indexOf(w)>-1; })?0:1;
      return an-bn;
    });
    return out;
  }
  function areaNames(){
    var seen={},out=[];
    state.places.forEach(function(p){ var a=(p.area||'').trim(); if(a&&!seen[a.toLowerCase()]){ seen[a.toLowerCase()]=1; out.push(a); } });
    return out;
  }
  function matchArea(text){
    var low=String(text||'').toLowerCase(), names=areaNames(), i;
    for(i=0;i<names.length;i++){ if(low.indexOf(names[i].toLowerCase())>-1) return names[i]; }
    var t=tok(text).filter(function(w){ return w.length>=4 && !STOP[w] && w!=='area'; }), hit=[];
    names.forEach(function(n){ var nl=n.toLowerCase(); if(t.some(function(w){ return nl.indexOf(w)>-1; })) hit.push(n); });
    return hit.length===1?hit[0]:null;
  }
  function nameList(arr,max){
    max=max||8;
    var s=arr.slice(0,max).map(function(p){ return p.nama; }).join(', ');
    return s+(arr.length>max?' dan '+(arr.length-max)+' lainnya':'');
  }
  function missingReport(){
    var f=[],pa=[],ar=[];
    state.places.forEach(function(p){
      if(!(p.foto&&p.foto.length)) f.push(p);
      if(!lines(p.patokan).length) pa.push(p);
      if(!lines(p.arah).length) ar.push(p);
    });
    var out=[];
    if(pa.length) out.push('Belum ada patokan ('+pa.length+'): '+nameList(pa));
    if(f.length) out.push('Belum ada foto ('+f.length+'): '+nameList(f));
    if(ar.length) out.push('Belum ada petunjuk arah ('+ar.length+'): '+nameList(ar));
    return out.length?out.join('\n\n'):'Semua alamat sudah punya foto, patokan, dan petunjuk arah.';
  }
  function groupReport(){
    if(!state.places.length) return 'Belum ada alamat tersimpan.';
    var g={}; state.places.forEach(function(p){ var a=(p.area||'').trim()||'(tanpa area)'; (g[a]=g[a]||[]).push(p); });
    var keys=Object.keys(g).sort(function(a,b){ return g[b].length-g[a].length || a.localeCompare(b,'id'); });
    return keys.map(function(k){ return k+' ('+g[k].length+'): '+nameList(g[k],6); }).join('\n')+
      '\n\nCatatan: saya tidak punya data jarak atau lalu lintas, jadi pengelompokan ini hanya berdasarkan area.';
  }
  function showFilter(q,area){
    state.area=area||'Semua'; state.q=q||''; var qi=$('q'); if(qi) qi.value=state.q; render();
  }
  function markDelivered(p){
    p.kunjungan=(p.kunjungan||0)+1; p.lastVisit=Date.now(); p.updated=p.updated||Date.now(); putPlace(p); render();
    return 'Dicatat: '+p.nama+' sudah diantar (total '+p.kunjungan+' kali).';
  }
  function pickOne(q,verb){
    var r=findPlaces(q);
    if(!r.length) return {reply:'Tidak ada alamat yang cocok dengan "'+q.trim()+'".'};
    if(r.length>1) return {reply:'Ada '+r.length+' alamat yang cocok: '+nameList(r,6)+'.\nSebutkan lebih lengkap supaya saya '+verb+' yang tepat.'};
    return {p:r[0]};
  }
  function localAgent(text){
    var raw=String(text).trim(), low=raw.toLowerCase().replace(/[?!.]+$/,'').trim(), m, r;
    if(/^(bantuan|help|menu|apa saja|bisa apa)/.test(low)) return {reply:HELP_TEXT};
    if(/^(cadangkan|backup|simpan cadangan)/.test(low)) return {reply:'Membuka penyimpanan cadangan…',after:function(){ saveBackup(); }};
    if(/\b(hapus|delete|kosongkan|buang)\b/.test(low)) return {reply:'Saya tidak menghapus data. Untuk menghapus, buka alamat lalu ketuk Ubah dan Hapus alamat.'};
    m=low.match(/^(?:tambah(?:kan)?|buat|simpan)\s+alamat\b[\s:,-]*(.*)$/);
    if(m){
      var rest=raw.replace(/^\S+\s+alamat\b[\s:,-]*/i,'').trim(), nama='', alamat=rest, c=rest.indexOf(',');
      if(c>0 && c<60){ nama=rest.slice(0,c).trim(); alamat=rest.slice(c+1).trim(); }
      return {reply:'Membuka form tambah alamat. Periksa lalu ketuk Simpan.',after:function(){ openSheet(form({nama:nama,alamat:alamat})); }};
    }
    m=low.match(/^(?:catat|tandai|centang)\s+(?:sudah\s+)?(?:diantar|terkirim)\s+(.+)$/) || low.match(/^(?:catat|tandai|centang)\s+(.+?)\s+(?:sudah\s+)?(?:diantar|terkirim)$/) || low.match(/^(.+?)\s+sudah\s+(?:diantar|terkirim)$/);
    if(m){ r=pickOne(m[1],'catat'); return r.p?{reply:markDelivered(r.p)}:r; }
    m=low.match(/^(?:salin|copy)\s+(?:petunjuk\s+)?(.+)$/);
    if(m){ r=pickOne(m[1],'salin'); return r.p?{reply:'Petunjuk '+r.p.nama+' disalin.',after:function(){ copy(guideText(r.p),'Petunjuk disalin'); }}:r; }
    if(/\b(berapa|jumlah|total)\b/.test(low)){
      var ar=matchArea(low);
      if(ar){ var n=state.places.filter(function(p){ return (p.area||'').trim()===ar; }).length; return {reply:'Ada '+n+' alamat di area '+ar+'.'}; }
      return {reply:'Ada '+state.places.length+' alamat tersimpan di '+areaNames().length+' area.'};
    }
    if(/(belum lengkap|kurang lengkap|data kurang|belum ada|tanpa (foto|patokan|arah))/.test(low)) return {reply:missingReport()};
    if(/(kelompok|per area|daftar area|area apa|rute)/.test(low)) return {reply:groupReport()};
    if(/^(reset|bersihkan filter|tampilkan semua|semua area|lihat semua)/.test(low)){ showFilter('',''); return {reply:'Filter dibersihkan. Daftar menampilkan semua alamat.'}; }
    m=low.match(/^(?:tampilkan|lihat|filter|buka)?\s*area\s+(.+)$/);
    if(m){
      var a2=matchArea(m[1]);
      if(!a2) return {reply:'Area "'+m[1]+'" tidak ditemukan. Area yang ada: '+(areaNames().join(', ')||'belum ada')+'.'};
      showFilter('',a2); return {reply:'Menampilkan area '+a2+' di daftar. Ketuk Tutup untuk melihatnya.'};
    }
    m=low.match(/^(?:cari|temukan|tampilkan|lihat|buka|di ?mana)\s+(.+)$/);
    if(m){
      r=findPlaces(m[1]);
      if(!r.length) return {reply:'Tidak ada alamat yang cocok dengan "'+m[1]+'".'};
      if(r.length===1) return {reply:r[0].nama+': '+r[0].alamat,after:function(){ openSheet(detail(r[0])); }};
      showFilter(m[1],'');
      return {reply:r.length+' alamat cocok: '+nameList(r,6)+'.\nDaftar sudah difilter. Ketuk Tutup untuk melihatnya.'};
    }
    return null;
  }
  function agentSend(text){
    text=String(text||'').trim(); if(!text||aiBusy) return;
    var local=null;
    try{ local=localAgent(text); }catch(e){ local={reply:'Perintah tidak bisa dijalankan. Coba kalimat lain.'}; }
    var inp=$('ai-in');
    if(local){
      aiBubble('user',text); if(local.reply) aiBubble('ai',local.reply);
      if(inp) inp.value='';
      if(local.after) local.after();
      return;
    }
    if(ai){ aiSend(text); return; }
    aiBubble('user',text);
    aiBubble('ai','Perintah belum dikenali. Ketik "bantuan" untuk melihat daftar perintah. Pertanyaan bebas butuh AI online, yang hanya tersedia di versi online FRSIS.');
    if(inp) inp.value='';
  }
  function brief(p){ return {nama:p.nama,alamat:p.alamat,area:p.area||''}; }
  function aiTools(){
    return [
      {name:'cari_alamat',description:'Cari alamat tersimpan berdasarkan kata kunci (nama, jalan, area, patokan, ciri rumah). Mengembalikan maksimal 8 hasil berisi nama, alamat, area.',
        inputSchema:{type:'object',properties:{kata:{type:'string',description:'Kata kunci pencarian'}},required:['kata']},
        execute:function(i){ return findPlaces(String(i.kata||'')).slice(0,8).map(brief); }},
      {name:'detail_alamat',description:'Ambil detail satu alamat (ciri rumah, patokan, petunjuk arah, catatan, jumlah foto) dari kata kunci yang cocok dengan satu alamat.',
        inputSchema:{type:'object',properties:{kata:{type:'string',description:'Nama atau kata kunci alamat'}},required:['kata']},
        execute:function(i){
          var r=findPlaces(String(i.kata||''));
          if(!r.length) throw new Error('Tidak ditemukan');
          if(r.length>1) throw new Error('Ada '+r.length+' yang cocok: '+nameList(r,6));
          var p=r[0]; return {nama:p.nama,alamat:p.alamat,area:p.area||'',ciri:p.ciri||'',patokan:lines(p.patokan),arah:lines(p.arah),catatan:p.catatan||'',jumlahFoto:(p.foto||[]).length,kunjungan:p.kunjungan||0};
        }},
      {name:'hitung_alamat',description:'Hitung alamat tersimpan. Hasilnya dihitung aplikasi dan akurat: total, jumlah per area, dan yang belum punya foto, patokan, atau petunjuk arah.',
        execute:function(){ return aiStats(state.places); }},
      {name:'tampilkan_di_daftar',description:'Menyaring daftar alamat di layar utama dengan kata kunci. Hanya mengubah tampilan, tidak mengubah data. Mengembalikan jumlah hasil.',
        inputSchema:{type:'object',properties:{kata:{type:'string',description:'Kata kunci; kosongkan untuk menampilkan semua'}}},
        execute:function(i){ var k=String(i.kata||''); showFilter(k,''); return {jumlah:k?findPlaces(k).length:state.places.length}; }}
    ];
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey && e.target && e.target.id==='ai-in'){ e.preventDefault(); agentSend(e.target.value); }
  });

  var delArmed=null;
  document.addEventListener('click',function(e){
    if(e.target===$('overlay')){ closeSheet(); return; }
    if(e.target.closest('#viewer')){ $('viewer').hidden=true; return; }
    var t=e.target.closest('[data-act]'); if(!t) return;
    var act=t.getAttribute('data-act'), id=t.getAttribute('data-id'), p=id?byId(id):null;
    if(act==='area'){ state.area=t.getAttribute('data-area'); render(); }
    else if(act==='add'){ openSheet(form()); }
    else if(act==='import'){ imp=null; openSheet(importSheet()); }
    else if(act==='backup'){ openSheet(backupSheet()); }
    else if(act==='dosave'){ saveBackup(); }
    else if(act==='copyguide' && p){ copy(guideText(p),'Petunjuk disalin'); }
    else if(act==='ai'){ openSheet(aiSheet()); }
    else if(act==='aiq'){ agentSend(AI_QUICK[+t.getAttribute('data-q')]); }
    else if(act==='aisend'){ agentSend($('ai-in')?$('ai-in').value:''); }
    else if(act==='aistop'){ if(aiCtl) aiCtl.abort(); }
    else if(act==='aiparse'){ aiParseMessy(); }
    else if(act==='aiphoto'){ aiFromPhotos(); }
    else if(act==='aimsg' && p){ aiMessage(p); }
    else if(act==='aimsgback' && p){ openSheet(detail(p)); }
    else if(act==='aimsgcopy'){ var mt=$('ai-msg'); if(mt&&mt.value) copy(mt.value,'Pesan disalin'); }
    else if(act==='parsetext'){ setImp(parseText($('m-text').value)); }
    else if(act==='impapply'){ applyImport(); }
    else if(act==='imprm' && imp){
      var ri=+t.getAttribute('data-i'), rr=imp.rows[ri];
      rr.foto.splice(+t.getAttribute('data-j'),1);
      if(rr.status==='ada' && !rr.foto.length) rr.include=false;
      refreshRow(ri);
    }
    else if(act==='open' && p){ openSheet(detail(p)); }
    else if(act==='edit' && p){ openSheet(form(p)); }
    else if(act==='close'){ closeSheet(); }
    else if(act==='zoom' && p){ $('vimg').src=p.foto[+t.getAttribute('data-i')]; $('viewer').hidden=false; }
    else if(act==='copyphone' && p){ copy(p.telp,'Nomor '+p.telp+' disalin'); }
    else if(act==='copyaddr' && p){ copy(p.nama+', '+p.alamat+(p.area?' ('+p.area+')':''),'Alamat disalin'); }
    else if(act==='visit' && p){ p.kunjungan=(p.kunjungan||0)+1; p.lastVisit=Date.now(); putPlace(p); openSheet(detail(p)); toast('Dicatat sudah diantar'); }
    else if(act==='rmphoto'){ state.draft.foto.splice(+t.getAttribute('data-i'),1); $('photos').innerHTML=photoThumbs(); }
    else if(act==='delete' && p){
      if(delArmed===id){ delArmed=null; state.places=state.places.filter(function(x){return x.id!==id;}); delPlace(id); closeSheet(); render(); toast('Alamat dihapus'); }
      else { delArmed=id; t.textContent='Ketuk lagi untuk menghapus'; }
    }
    else if(act==='clearsamples'){
      var ex=state.places.filter(function(x){return x.sample;});
      state.places=state.places.filter(function(x){return !x.sample;});
      ex.forEach(function(x){ delPlace(x.id); }); render(); toast('Contoh dihapus');
    }
  });

  document.addEventListener('change',function(e){
    var el=e.target;
    if(el.id==='sort'){ sortKey=el.value; try{ localStorage.setItem('frsis.sort',sortKey); }catch(e){} renderList(); return; }
    if(el.id==='b-file'){
      var bf=el.files&&el.files[0]; el.value='';
      if(bf){ var br=new FileReader(); br.onload=function(){ restoreFrom(String(br.result||'')); }; br.onerror=function(){ toast('File tidak bisa dibaca.'); }; br.readAsText(bf); }
      return;
    }
    if(el.id==='m-file'){ importFile(el); return; }
    if(el.id && el.id.indexOf('m-map-')===0 && imp){
      imp.map[el.getAttribute('data-field')]=el.value===''?null:+el.value;
      rebuildImp(); return;
    }
    if(el.getAttribute && el.getAttribute('data-imgfor')!==null && imp){ addImpPhotos(+el.getAttribute('data-imgfor'),el); return; }
    if(el.matches && el.matches('.imp-row input[type="checkbox"]') && imp){
      imp.rows[+el.getAttribute('data-i')].include=el.checked;
      el.closest('.imp-row').classList.toggle('off',!el.checked); updateApply(); return;
    }
    if(el.id!=='i-cam' && el.id!=='i-gal') return;
    var files=Array.prototype.slice.call(el.files||[]);
    el.value='';
    if(!state.draft) return;
    var room=4-state.draft.foto.length;
    if(room<=0){ toast('Maksimal 4 foto'); return; }
    if(files.length>room){ toast('Hanya '+room+' foto yang muat'); files=files.slice(0,room); }
    Promise.all(files.map(function(f){ return shrink(f,1000,0.72); })).then(function(list){
      if(!state.draft) return;
      state.draft.foto=state.draft.foto.concat(list).slice(0,4);
      $('photos').innerHTML=photoThumbs();
    }).catch(function(){ toast('Foto tidak bisa dibaca. Coba foto lain.'); });
  });

  document.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target; if(f.id!=='f-place') return;
    var id=f.getAttribute('data-id'), p=id?byId(id):null;
    var data={
      nama:$('i-nama').value.trim(), alamat:$('i-alamat').value.trim(), area:$('i-area').value.trim(),
      ciri:$('i-ciri').value.trim(), patokan:$('i-patokan').value.trim(), arah:$('i-arah').value.trim(),
      telp:$('i-telp').value.trim(), maps:$('i-maps').value.trim(), catatan:$('i-cat').value.trim(),
      foto:state.draft?state.draft.foto.slice():[], updated:Date.now()
    };
    if(!p){
      var dk=norm(data.alamat);
      var same=state.places.filter(function(x){ return norm(x.alamat)===dk; })[0];
      if(same && dupArmed!==dk){ dupArmed=dk; toast('Alamat ini sudah tersimpan atas nama '+same.nama+'. Ketuk Simpan lagi untuk tetap menambah.'); return; }
      dupArmed=null;
    }
    if(p){ Object.assign(p,data); }
    else { data.id=uid(); data.kunjungan=0; state.places.push(data); p=data; }
    putPlace(p).then(function(){ toast('Alamat tersimpan'); });
    closeSheet(); render();
  });

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(!$('viewer').hidden){ $('viewer').hidden=true; } else if(!$('overlay').hidden){ closeSheet(); }
  });
  $('q').addEventListener('input',function(e){ state.q=e.target.value; renderList(); });

  render();
  boot();
  initAI();
  initDL();
  $('sort').value=sortKey;
})();
</script>

</body></html>
